# Dependencias del servicio de pronóstico (app.py), las que se instalan en Vercel.
# Los notebooks usan requirements.txt.
[project]
name = "restocker-forecasting"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.163.0",
  "httpx==0.28.1",
  "holidays==0.108",
  "numpy==2.5.4",
  "pandas==3.1.1",
]
# Sin torch: pesa ~700 MB y Vercel acepta 500 MB por función. El modelo se sirve con NumPy
# (src/numpy_model.py) a partir de los pesos exportados (scripts/export_weights.py).
